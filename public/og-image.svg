<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#080C14" />
  
  <!-- Subtle Background Grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0F1624" stroke-width="1" />
    </pattern>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#080C14" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
  </defs>
  
  <rect width="1200" height="630" fill="url(#grid)" />
  <circle cx="200" cy="180" r="400" fill="url(#glow)" />
  
  <!-- MotionBird Logo Mark -->
  <g transform="translate(140, 160)">
    <rect width="96" height="96" rx="24" fill="url(#brandGrad)" />
    <!-- Wing / Lightning Glyphs -->
    <path d="M52 14L16 54h32l-4 32 36-44H48l4-32z" fill="#080C14" stroke="#080C14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  
  <!-- Product Typography -->
  <text x="260" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="76" font-weight="900" fill="#FFFFFF" letter-spacing="-2">
    Motion<tspan fill="#00F2FE">Bird</tspan>
  </text>
  
  <!-- Tagline -->
  <text x="140" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#FFFFFF" letter-spacing="-0.5">
    Real-time movement intelligence.
  </text>
  
  <!-- Sub-bullet descriptions -->
  <text x="140" y="405" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#94A3B8">
    Client-side computer vision &bull; Authentic repetition detection &bull; Biomechanical form coaching
  </text>
  
  <!-- Technical Trust Badge -->
  <g transform="translate(140, 470)">
    <rect width="440" height="48" rx="24" fill="#0F1624" stroke="#1E293B" stroke-width="1.5" />
    <circle cx="28" cy="24" r="6" fill="#10B981" />
    <text x="46" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#F8FAFC">
      100% ON-DEVICE &bull; ZERO VIDEO UPLOADED
    </text>
  </g>
  
  <!-- Wireframe Skeleton Graphic on Right -->
  <g transform="translate(900, 160)">
    <!-- Head -->
    <circle cx="100" cy="40" r="24" stroke="#00F2FE" stroke-width="3" fill="none" />
    <!-- Spine -->
    <line x1="100" y1="64" x2="100" y2="160" stroke="#00F2FE" stroke-width="4" />
    <!-- Arms -->
    <line x1="50" y1="90" x2="150" y2="90" stroke="#00F2FE" stroke-width="4" />
    <line x1="50" y1="90" x2="25" y2="150" stroke="#00F2FE" stroke-width="3" />
    <line x1="25" y1="150" x2="20" y2="200" stroke="#00F2FE" stroke-width="3" />
    <line x1="150" y1="90" x2="175" y2="150" stroke="#00F2FE" stroke-width="3" />
    <line x1="175" y1="150" x2="180" y2="200" stroke="#00F2FE" stroke-width="3" />
    <!-- Hips & Legs -->
    <line x1="70" y1="160" x2="130" y2="160" stroke="#00F2FE" stroke-width="4" />
    <line x1="70" y1="160" x2="45" y2="230" stroke="#10B981" stroke-width="4" />
    <line x1="45" y1="230" x2="45" y2="300" stroke="#10B981" stroke-width="4" />
    <line x1="130" y1="160" x2="155" y2="230" stroke="#10B981" stroke-width="4" />
    <line x1="155" y1="230" x2="155" y2="300" stroke="#10B981" stroke-width="4" />
    <!-- Nodes -->
    <circle cx="45" cy="230" r="7" fill="#10B981" />
    <circle cx="155" cy="230" r="7" fill="#10B981" />
    <circle cx="100" cy="160" r="5" fill="#00F2FE" />
    <circle cx="50" cy="90" r="5" fill="#00F2FE" />
    <circle cx="150" cy="90" r="5" fill="#00F2FE" />
  </g>
</svg>
